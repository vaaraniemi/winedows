 y="652" text-anchor="middle" font-family="Liberation Mono, DejaVu Sans Mono, monospace" fill="#fff" font-size="16">56 UNITS (ONE WIN32)</text><path d="M660 143 V597" stroke="#fff" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="648" y="370" text-anchor="middle" font-family="Liberation Mono, DejaVu Sans Mono, monospace" fill="#fff" font-size="16" transform="rotate(-90 648 370)">58 UNITS</text><rect x="240" y="730" width="760" height="144" fill="none" stroke="#fff" stroke-width="2"/><text x="256" y="758" font-family="Liberation Mono, DejaVu Sans Mono, monospace" fill="#fff" font-size="20" font-weight="bold">GIGAHARD WINEDOWS · GENERAL ARRANGEMENT</text><text x="256" y="792" font-family="Liberation Mono, DejaVu Sans Mono, monospace" fill="#fff" font-size="17">DWG NO. WD-0001   REV 32 (Win32)   SHEET 1 OF 1</text><line x1="240" y1="768" x2="1000" y2="768" stroke="#fff" stroke-opacity="0.6"/><text x="256" y="826" font-family="Liberation Mono, DejaVu Sans Mono, monospace" fill="#fff" font-size="17">SCALE 1:1   TOLERANCE ±0 ABI BREAKS</text><line x1="240" y1="802" x2="1000" y2="802" stroke="#fff" stroke-opacity="0.6"/><text x="256" y="860" font-family="Liberation Mono, DejaVu Sans Mono, monospace" fill="#fff" font-size="17">DRAWN: L.T.   CHECKED: WINE   APPROVED: IT WORKS</text><line x1="240" y1="836" x2="1000" y2="836" stroke="#fff" stroke-opacity="0.6"/><g font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif"><use xlink:href="#mark" href="#mark" x="1832.0" y="944.0" width="48.0" height="48.0" /><text x="1816" y="966" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="end">GigaHard Winedows</text><text x="1816" y="989" fill="#ffffff" fill-opacity="0.72" font-size="16" text-anchor="end">Linux, but it works.</text></g>
