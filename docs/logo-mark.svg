<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Winedows">
  <title>Winedows</title>
  <!-- Compact mark for small sizes (navbar, favicon): the four panes from logo.svg, no wordmark, simplified details -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c1d3f"/><stop offset="1" stop-color="#5e0f27"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2aa3ff"/><stop offset="1" stop-color="#0a4fd6"/></linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-width="2.5">
    <polygon points="4,10 30,8 30,30 4,30"  fill="url(#red)"  stroke="url(#red)"/>
    <polygon points="4,34 30,34 30,58 4,57" fill="url(#red)"  stroke="url(#red)"/>
    <polygon points="34,7 60,3 60,30 34,30" fill="url(#blue)" stroke="url(#blue)"/>
    <polygon points="34,34 60,34 60,61 34,58" fill="url(#blue)" stroke="url(#blue)"/>
  </g>
  <!-- wine glass -->
  <path d="M9.5 12.5 H24.5 C24.5 21.5 21 25.5 17 25.5 C13 25.5 9.5 21.5 9.5 12.5 Z" fill="#fff"/>
  <path d="M11.2 16.5 C14 15.6 20 17.4 22.8 16.5 C22.3 21.6 20 23.8 17 23.8 C14 23.8 11.7 21.6 11.2 16.5 Z" fill="#c42a55"/>
  <path d="M17 25 V28.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <!-- grapes -->
  <g fill="#fff">
    <circle cx="11" cy="42" r="3.3"/><circle cx="17" cy="42" r="3.3"/><circle cx="23" cy="42" r="3.3"/>
    <circle cx="14" cy="47.6" r="3.3"/><circle cx="20" cy="47.6" r="3.3"/>
    <circle cx="17" cy="53.1" r="3.3"/>
  </g>
  <!-- swoosh -->
  <path d="M37 55.5 C48 55.5 56 49 59.3 39 C55 48 47.5 52.6 37 53.2 Z" fill="#fff" opacity=".9"/>
</svg>
