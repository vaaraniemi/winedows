name: build-iso
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck && make lint
      - run: make iso
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: winedows-iso
          path: out/*.iso
