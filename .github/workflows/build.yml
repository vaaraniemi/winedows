name: build-iso
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'claude/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck && make lint
      - run: make iso
      - uses: actions/upload-artifact@v4
        with:
          name: winedows-iso
          path: out/*.iso
          compression-level: 0
          retention-days: 14

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: winedows-iso
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true
      - run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-log
          path: out/serial.log
          if-no-files-found: ignore

  release:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winedows-iso
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd out
          iso=$(ls winedows-*.iso | head -1)
          sha256sum "$iso" > SHA256SUMS
          assets="SHA256SUMS"
          # GitHub release assets are limited to 2 GiB each
          if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d "$iso" "$iso.part"
            assets="$assets $iso.part*"
            note="ISO is split: cat $iso.part* > $iso"
          else
            assets="$assets $iso"
            note="Boot it in QEMU/VirtualBox or write it to USB with dd. Login is automatic."
          fi
          tag="iso-${GITHUB_RUN_NUMBER}"
          # shellcheck disable=SC2086
          gh release create "$tag" $assets --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Winedows ISO build $GITHUB_RUN_NUMBER" \
            --notes "Debian 13 + Cinnamon + Edgy + Wine, no apt. $note"
