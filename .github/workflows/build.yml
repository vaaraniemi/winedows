name: build-iso
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: make lint || true
      - run: make iso
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: winedows-iso
          path: out/*.iso
